# Configuration SonarQube — voir docs/adr/0012-ci-cd-environnements.md.
# SONAR_HOST_URL et SONAR_TOKEN sont fournis en variables CI/CD GitLab
# (jamais commités ici).

sonar.projectKey=oumra-hadj-backend
sonar.projectName=Oumra & Hadj — Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
