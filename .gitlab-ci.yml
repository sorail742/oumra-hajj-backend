# Pipeline CI — voir docs/adr/0012-ci-cd-environnements.md.
# Exécuté sur chaque Merge Request et sur les push vers develop/main : une
# fonctionnalité = une branche, fusionnée dans develop une fois la CI verte,
# puis develop fusionné dans main pour une mise en production (voir ADR 0011).

# Image Debian (pas -alpine) : bcrypt (module natif) a besoin des outils de
# compilation présents par défaut sur cette image.
image: node:24

stages:
  - quality
  - test
  - build
  - sonarqube

variables:
  NODE_ENV: test
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.node_job:
  before_script:
    - npm ci --prefer-offline --cache .npm

lint:
  extends: .node_job
  stage: quality
  script:
    - npm run lint:ci

unit-tests:
  extends: .node_job
  stage: test
  script:
    - npm run test:cov
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1h

e2e-tests:
  extends: .node_job
  stage: test
  # Service Postgres pour les tests e2e (ADR 0013) — voir
  # test/utils/postgres-test-db.ts pour l'équivalent local (testcontainers).
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: oumra_hadj_test
    POSTGRES_USER: oumra_hadj
    POSTGRES_PASSWORD: oumra_hadj_test
    DATABASE_URL: 'postgresql://oumra_hadj:oumra_hadj_test@postgres:5432/oumra_hadj_test'
  script:
    - npx prisma migrate deploy
    - npm run test:e2e

build:
  extends: .node_job
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1h

sonarqube-check:
  stage: sonarqube
  needs: ["unit-tests"]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  # Non-bloquant tant que SONAR_HOST_URL/SONAR_TOKEN ne sont pas configurés
  # dans les paramètres CI/CD du projet GitLab (voir ADR 0012). À retirer une
  # fois le serveur SonarQube et le quality gate en place.
  allow_failure: true
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
